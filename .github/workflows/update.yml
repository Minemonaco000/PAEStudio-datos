name: Publicar datos verificados de Mi ingreso
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['admissions/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: admission-public-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar monitor y publicación
        run: |
          python tests/admissions-monitor.py
          python tests/admissions-feed.py
      - name: Consultar fuentes
        id: monitor
        continue-on-error: true
        run: python admissions/check_sources.py --state .monitor/report.json --output-dir .monitor
      - name: Generar canal sin alterar datos aprobados
        run: python admissions/feed.py --output public
      - name: Resumen editorial
        run: python admissions/ci_summary.py
      - name: Publicar archivos y manifiesto en un único commit
        run: |
          git config user.name 'PAEStudio datos'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public .monitor
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar estado y datos verificados de Mi ingreso'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-y-revision
          path: |
            public/
            .monitor/
          retention-days: 90
      - name: Señalar un fallo completo del monitor
        if: steps.monitor.outcome == 'failure'
        run: exit 1
